<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1F3864">
<title>Arbeitsplan Deutsch KK9</title>
<style>
:root{
  --bg:#eef1f6; --karte:#ffffff; --text:#1b2430; --gedaempft:#5b6779; --rand:#d9dfe7;
  --akzent:#1F3864; --akzent-hell:#2e5aa8; --akzent-weich:#e6edf8;
  --offen:#F4CCCC; --offen-r:#d99393; --offen-t:#7d2626;
  --arbeit:#FFF2CC; --arbeit-r:#e2c25f; --arbeit-t:#6b5000;
  --fertig:#D9EAD3; --fertig-r:#93c47d; --fertig-t:#2a5e22;
  --kontrolliert:#A9D08E; --kontrolliert-r:#5f9e42; --kontrolliert-t:#173f0c;
  --radius:14px; --tap:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
     background:var(--bg);color:var(--text);font-size:17px;line-height:1.45}
button{font:inherit;color:inherit;min-height:var(--tap);padding:10px 16px;border-radius:10px;
       border:1px solid var(--rand);background:var(--karte);cursor:pointer}
button:active{transform:translateY(1px)}
button[disabled]{opacity:.4;cursor:default;transform:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--akzent-hell);outline-offset:2px}
.primaer{background:var(--akzent);border-color:var(--akzent);color:#fff;font-weight:650}
.gefahr{color:#9b1c1c;border-color:#e6b8b8;background:#fff6f6}
.klein{min-height:40px;padding:6px 12px;font-size:.92rem}
.gedaempft{color:var(--gedaempft);font-size:.92rem}
.verborgen{display:none!important}
input[type=text],input[type=email],input[type=password],select,textarea{font:inherit;min-height:44px;
  padding:8px 10px;border:1px solid var(--rand);border-radius:10px;width:100%;background:#fff;color:var(--text)}
textarea{min-height:84px;resize:vertical;line-height:1.4}
input[type=color]{width:48px;height:44px;padding:2px;border:1px solid var(--rand);border-radius:10px;background:#fff}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--akzent)}

/* Kopf */
.kopf{background:var(--akzent);color:#fff;padding:12px 16px 0;position:sticky;top:0;z-index:20;
      box-shadow:0 2px 12px rgba(15,30,60,.2)}
.kopf-zeile{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.marke{flex:1;min-width:200px}
.titel{font-weight:750;font-size:1.22rem;letter-spacing:.01em}
.untertitel{opacity:.8;font-size:.88rem}
.kopf-rechts{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;font-weight:650;padding:5px 11px;
      border-radius:999px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.28);white-space:nowrap}
.pill .punkt{width:9px;height:9px;border-radius:50%;background:#c8d2e0}
.pill.live .punkt{background:#5ee08a;box-shadow:0 0 0 3px rgba(94,224,138,.25)}
.pill.verbinde .punkt{background:#ffc94d}
.pill.offline .punkt,.pill.fehler .punkt{background:#ff7b6b}
.tabs{max-width:1240px;margin:10px auto 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{background:transparent;border:none;color:#d3ddef;border-radius:11px 11px 0 0;padding:10px 16px;
     font-weight:650;white-space:nowrap;min-height:46px}
.tab.aktiv{background:var(--bg);color:var(--akzent)}

/* Rahmen */
.huelle{max-width:1240px;margin:0 auto;padding:14px 16px 80px}
.schmal{max-width:860px;margin-left:auto;margin-right:auto}
.karte{background:var(--karte);border:1px solid var(--rand);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
h2{font-size:1.25rem;margin:.1em 0 .35em}
h3{font-size:1.05rem;margin:.1em 0 .6em}
.zeile{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hinweis{background:#fff8e1;border:1px solid #efd78a;color:#5e4600;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.95rem}
.hinweis.rot{background:#fdeeee;border-color:#efb4b4;color:#7d2626}
.hinweis.blau{background:#eaf1fb;border-color:#bcd0ee;color:#1f3864}

/* DL-Leiste */
.dl-leiste{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:4px;scrollbar-width:thin}
.dl-chip{display:flex;flex-direction:column;align-items:flex-start;min-width:92px;padding:7px 12px;line-height:1.2;
         border-radius:12px;background:#fff;flex:0 0 auto}
.dl-chip b{font-size:.98rem}
.dl-chip span{font-size:.78rem;color:var(--gedaempft)}
.dl-chip i{font-style:normal;font-size:.68rem;font-weight:750;color:#1d6b38;background:#ddf3e4;border-radius:6px;padding:0 6px;margin-top:3px}
.dl-chip.aktiv{background:var(--akzent);border-color:var(--akzent);color:#fff}
.dl-chip.aktiv span{color:#cfdaf0}
.dl-chip.neu{justify-content:center;align-items:center;border-style:dashed;color:var(--akzent);font-weight:650}

/* DL-Kopf */
.dl-kopf{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:6px 0 12px}
.dl-nr{font-size:.82rem;font-weight:750;color:var(--akzent-hell);text-transform:uppercase;letter-spacing:.06em}
.dl-kopf h2{margin:0;font-size:1.4rem}
.dl-kopf .aktionen{margin-left:auto}

/* Legende */
.legende{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.leg{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid}
.legende .gedaempft{font-size:.84rem;margin-left:6px}

/* Statusfarben (wie im Excel) */
.st-offen{background:var(--offen);border-color:var(--offen-r);color:var(--offen-t)}
.st-arbeit{background:var(--arbeit);border-color:var(--arbeit-r);color:var(--arbeit-t)}
.st-fertig{background:var(--fertig);border-color:var(--fertig-r);color:var(--fertig-t)}
.st-kontrolliert{background:var(--kontrolliert);border-color:var(--kontrolliert-r);color:var(--kontrolliert-t)}
.st-leer{background:#f7f8fa;border-color:#dde1e7;color:#97a0ad}

/* Mein Plan */
.ich-kopf{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.punkt-gross{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:800;
             font-size:1.15rem;color:#1b2430;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.kennzahl{text-align:right}
.kennzahl b{display:block;font-size:1.35rem;line-height:1.1}
.fortschritt{height:12px;background:#e7ebf1;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.fortschritt>i{display:block;height:100%;background:linear-gradient(90deg,#5f9e42,#93c47d);border-radius:99px;transition:width .4s}
.auftrag{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;background:#fff;
         border:1px solid var(--rand);border-left:7px solid #dde1e7;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.auftrag.st-offen{border-left-color:var(--offen-r);background:#fff;color:inherit}
.auftrag.st-arbeit{border-left-color:var(--arbeit-r);background:#fffdf4;color:inherit}
.auftrag.st-fertig{border-left-color:var(--fertig-r);background:#f9fcf8;color:inherit}
.auftrag.st-kontrolliert{border-left-color:var(--kontrolliert-r);background:#f2f9ee;color:inherit}
.auftrag.st-leer{background:#fbfbfc;color:inherit;border-color:var(--rand);border-left-color:#e3e6eb}
.nr{width:34px;height:34px;border-radius:50%;background:var(--akzent-weich);color:var(--akzent);font-weight:800;
    display:grid;place-items:center;font-size:.95rem;flex:0 0 auto}
.auftrag .text{font-weight:600}
.wo{font-size:.86rem;color:var(--gedaempft);margin-top:2px}
.art{display:inline-block;font-size:.7rem;font-weight:800;padding:1px 7px;border-radius:6px;margin-right:6px;vertical-align:2px;white-space:nowrap}
.art.z{background:#fff0c2;color:#704c00}
.art.puffer{background:#e1eafb;color:#244a8a}
.segment{display:flex;gap:6px;flex-wrap:wrap}
.seg{min-width:96px;padding:8px 10px;font-weight:650;background:#fff;color:var(--gedaempft)}
.seg.aktiv{font-weight:800;border-width:2px}
.kontrolliert-marke{font-weight:800;color:var(--kontrolliert-t);background:var(--kontrolliert);border-radius:10px;padding:10px 14px;white-space:nowrap}
.nehmen{border-style:dashed;color:var(--akzent);font-weight:650;background:#fff}
.ziel-text{font-size:1.05rem;font-weight:600;margin:.2em 0 .8em}
.flk-zeile{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-top:1px solid #eef0f4}
.flk-zeile:first-of-type{border-top:none}
.ha-liste{list-style:none;margin:0;padding:0}
.ha-liste li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid #eef0f4}
.ha-liste li:first-child{border-top:none}
.ha-liste .bis{margin-left:auto;white-space:nowrap;font-weight:650;color:var(--akzent)}
.ich-raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px}
.ich-wahl{display:flex;align-items:center;gap:12px;text-align:left;font-weight:700;font-size:1.05rem;padding:10px 12px;min-height:66px}
@media (max-width:680px){
  .auftrag{grid-template-columns:34px 1fr}
  .auftrag .steuerung{grid-column:1/-1}
  .segment{width:100%}
  .seg{flex:1;min-width:0;padding:8px 4px}
}

/* Raster */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);background:#fff;border:1px solid var(--rand)}
table.raster{border-collapse:separate;border-spacing:0;width:100%}
.raster th,.raster td{padding:4px;border-bottom:1px solid #eef0f4;text-align:center;vertical-align:middle}
.raster thead th{background:#fff;padding:8px 4px}
.raster td,.raster thead th:not(.sp-auftrag){min-width:96px}
.raster .sp-auftrag{text-align:left;min-width:230px;max-width:390px;position:sticky;left:0;background:#fff;z-index:1;
                    padding:8px 10px;font-weight:500;box-shadow:1px 0 0 #eef0f4}
.auftrag-kopf{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;min-height:0;padding:2px;border:none;background:transparent;font-weight:500}
.auftrag-kopf .nr{width:28px;height:28px;font-size:.85rem}
.kopf-name{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;border-radius:10px;
           font-weight:750;padding:6px 6px;border:none;color:#1b2430;font-size:.95rem;line-height:1.15}
.zelle{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;border-radius:9px;border:1px solid;
       font-size:.84rem;font-weight:700;padding:4px;line-height:1.1;text-align:center}
button.zelle{cursor:pointer}
.zelle.st-leer{border-style:dashed}
.raster .ich-spalte{background:#f2f6fd}
.raster tfoot th,.raster tfoot td{background:#fafbfc}
.raster tfoot .sp-auftrag{background:#fafbfc;font-weight:650}
.raster tfoot tr:first-child>*{border-top:2px solid #e3e7ee}
.mini{height:7px;background:#e7ebf1;border-radius:99px;overflow:hidden;margin:4px 6px 0}
.mini>i{display:block;height:100%;background:#5f9e42;border-radius:99px}
.zahl{font-weight:750;font-size:.95rem}
.ha-zelle{border-style:solid;border-color:#e6e9ee;background:#fff;color:#1b2430;font-size:1rem}
.ha-zelle.an{border-color:rgba(0,0,0,.08)}
@media (max-width:900px){
  .raster td,.raster thead th:not(.sp-auftrag){min-width:76px}
  .raster .sp-auftrag{min-width:190px}
  .zelle{font-size:.78rem}
}

/* Übersicht */
.ue-zelle{position:relative;border-radius:8px;padding:9px 4px;overflow:hidden;background:#f1f3f6;font-weight:700;font-size:.9rem}
.ue-zelle>i{position:absolute;left:0;top:0;bottom:0;background:#cfe6c4}
.ue-zelle.voll>i{background:#a9d08e}
.ue-zelle>span{position:relative}
.klassenziel{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.klassenziel .fortschritt{flex:1;min-width:200px;height:16px}

/* Bearbeiten */
.feld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.feld label{font-size:.84rem;font-weight:650;color:var(--gedaempft)}
.raster2{display:grid;grid-template-columns:180px 1fr;gap:0 14px}
@media (max-width:700px){.raster2{grid-template-columns:1fr}}
.edit-zeile{display:grid;grid-template-columns:34px minmax(180px,1fr) minmax(120px,210px) 130px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #eef0f4}
.edit-zeile.lern{grid-template-columns:54px minmax(120px,1fr) minmax(120px,1fr) auto}
.edit-zeile.ha{grid-template-columns:minmax(180px,1fr) 130px minmax(160px,1.2fr) auto}
@media (max-width:820px){
  .edit-zeile,.edit-zeile.lern,.edit-zeile.ha{grid-template-columns:34px 1fr}
  .edit-zeile>*:not(:first-child){grid-column:2}
  .edit-zeile.ha>*{grid-column:1/-1!important}
}
.knopf-gruppe{display:flex;gap:4px;flex-wrap:wrap}
.icon{min-width:44px;padding:6px 8px}
.chip-wahl{display:flex;gap:4px;flex-wrap:wrap}
.chip{min-height:36px;min-width:36px;padding:4px 8px;font-size:.8rem;font-weight:750;border-radius:9px;opacity:.35}
.chip.an{opacity:1;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.neu-form{background:#f7f9fc;border:1px dashed #c9d3e2;border-radius:12px;padding:12px;margin-top:10px}
.link-feld{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
details>summary{cursor:pointer;font-weight:650;min-height:40px;display:flex;align-items:center}
code{background:#f1f3f6;border-radius:6px;padding:1px 6px;font-size:.88em}

/* Dialog */
.dialog-hg{position:fixed;inset:0;background:rgba(20,28,38,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.dialog{background:#fff;border-radius:16px;padding:20px;max-width:460px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog h3{margin-top:0}
.wahl-liste{display:grid;gap:8px;margin:12px 0}
.wahl{width:100%;text-align:left;font-weight:750;border-width:2px}
.wahl.aktiv{outline:3px solid var(--akzent);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1b2430;color:#fff;padding:12px 18px;
       border-radius:12px;font-weight:650;opacity:0;pointer-events:none;transition:all .3s;z-index:60;max-width:90vw;text-align:center}
.toast.zeigen{opacity:1;transform:translateX(-50%) translateY(0)}

/* Beamer */
body.beamer{font-size:19px}
body.beamer .huelle{max-width:none;padding:14px 22px 30px}
body.beamer .dl-kopf h2{font-size:1.8rem}
body.beamer .raster .zelle{min-height:48px;font-size:.98rem}
body.beamer .raster .sp-auftrag{font-size:1.02rem;max-width:460px}
body.beamer .kopf-name{font-size:1.1rem;min-height:48px}
body.beamer .raster th,body.beamer .raster td{padding:3px 4px}
.beamer-pill{background:var(--akzent);color:#fff;border-color:var(--akzent)}

@media (hover:hover){button:hover{filter:brightness(.97)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;font-size:10pt}
  .nicht-drucken,.kopf,.dl-leiste,.toast{display:none!important}
  .huelle{max-width:none;padding:0}
  .karte,.scroll-x{border:1px solid #999;break-inside:avoid}
  .scroll-x{overflow:visible}
  .raster .sp-auftrag{position:static}
  .zelle,.kopf-name,.st-offen,.st-arbeit,.st-fertig,.st-kontrolliert,.punkt-gross,.mini>i,.fortschritt>i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .zelle,.kopf-name{min-height:26px}
  .raster td,.raster thead th:not(.sp-auftrag){min-width:0}
}
</style>
</head>

    {

        ["Z", "Bonus: Bericht-Würfel schriftlich oder Arbeitsheft Sprachstarken 7, S. 79-81", "DOS 1, 2.6"],

      hausaufgaben: [   // [Auftrag, auf wann, für alle zugeteilt?]

/* ========================================================================
   2. SPEICHER — localStorage, wenn vorhanden, sonst Arbeitsspeicher.
   ======================================================================== */
const Speicher = (() => {
  let vorhanden = false; const ersatz = {};
  const k = s => DATEN.speicherPraefix + s;
  try { window.localStorage.setItem(k("__test__"), "1"); window.localStorage.removeItem(k("__test__")); vorhanden = true; }
  catch (e) { vorhanden = false; }
  return {
    dauerhaft: vorhanden,
    lies(schluessel, standard) {
      try {
        const roh = vorhanden ? window.localStorage.getItem(k(schluessel)) : ersatz[k(schluessel)];
        return roh == null ? standard : JSON.parse(roh);
      } catch (e) { return standard; }
    },
    schreib(schluessel, wert) {
      try { const roh = JSON.stringify(wert); if (vorhanden) window.localStorage.setItem(k(schluessel), roh); else ersatz[k(schluessel)] = roh; }
      catch (e) { /* Speichern ist nie kritisch */ }
    },
    loesche(schluessel) {
      try { if (vorhanden) window.localStorage.removeItem(k(schluessel)); else delete ersatz[k(schluessel)]; } catch (e) {}
    },
  };
})();

/* ========================================================================
   2b. SYNCHRONISIERUNG (Firebase Realtime Database über REST, kein SDK)
   Schreiben mit Offline-Warteschlange, Lehrer-Anmeldung (Stufe 2) mit
   automatischer Verlängerung, Abgleich im Takt als Rückfall.
   Die Regeln sind der Schutz, nicht dieser Code.
   ======================================================================== */
const Sync = (() => {
  let idToken = null, refreshToken = null, uid = null, email = null, ablauf = 0;
  let taktId = null, letzterFehler = null, aktiverTakt = null, beiAbmeldung = null, liefert = false;
  const WARTESCHLANGE = "warteschlange";
  const SITZUNG = DATEN.speicherPraefix + "sitzung";

  const basis = () => CONFIG.datenbank.replace(/\/$/, "") + "/" + CONFIG.projekt + "/";
  function url(pfad, mitAuth = true) {
    const u = basis() + String(pfad).replace(/^\//, "") + ".json";
    return (mitAuth && idToken) ? u + "?auth=" + encodeURIComponent(idToken) : u;
  }

  async function anfrage(pfad, methode, koerper, zweiterVersuch) {
    if (DEMO) return { ok: false, status: 0 };
    if (idToken && refreshToken && Date.now() > ablauf - 120000) await erneuern();
    try {
      const antwort = await fetch(url(pfad), {
        method: methode, cache: "no-store",
        headers: koerper !== undefined ? { "Content-Type": "application/json" } : undefined,
        body: koerper !== undefined ? JSON.stringify(koerper) : undefined,
      });
      if (!antwort.ok) {
        if (antwort.status === 401 && refreshToken && !zweiterVersuch && await erneuern()) return anfrage(pfad, methode, koerper, true);
        letzterFehler = "HTTP " + antwort.status;
        return { ok: false, status: antwort.status };   // 401/403: die Regeln greifen
      }
      letzterFehler = null;
      return { ok: true, daten: await antwort.json() };
    } catch (e) {
      letzterFehler = "kein Netz";
      return { ok: false, status: 0 };
    }
  }

  const liste = () => Speicher.lies(WARTESCHLANGE, []);
  function einreihen(methode, pfad, wert) {
    const l = liste(); l.push({ methode, pfad, wert, zeit: Date.now() }); Speicher.schreib(WARTESCHLANGE, l);
  }

  /* Gepufferte Schreibvorgänge in der ursprünglichen Reihenfolge nachliefern. */
  async function nachliefern() {
    if (liefert || DEMO) return 0;
    liefert = true; let geliefert = 0;
    try {
      while (true) {
        const l = liste(); if (!l.length) break;
        const { methode, pfad, wert } = l[0];
        const r = await anfrage(pfad, methode || "PUT", wert);
        if (!r.ok && r.status === 0) break;          // immer noch kein Netz
        const rest = liste(); rest.shift(); Speicher.schreib(WARTESCHLANGE, rest);   // von den Regeln abgelehnt: nicht endlos wiederholen
        if (r.ok) geliefert++;
      }
    } finally { liefert = false; }
    return geliefert;
  }

  async function sicher(methode, pfad, wert) {
    if (liste().length) { einreihen(methode, pfad, wert); nachliefern(); return { ok: false, gepuffert: true }; }
    const r = await anfrage(pfad, methode, wert);
    if (r.ok || r.status !== 0) return r;
    einreihen(methode, pfad, wert);
    return { ok: false, gepuffert: true };
  }

  function setzeSitzung(d) {
    idToken = d.idToken; refreshToken = d.refreshToken; uid = d.localId || uid; email = d.email || email;
    ablauf = Date.now() + (Number(d.expiresIn) || 3600) * 1000;
    try { window.sessionStorage.setItem(SITZUNG, JSON.stringify({ refreshToken, uid, email })); } catch (e) {}
  }
  function abmeldenIntern(grund) {
    idToken = null; refreshToken = null; uid = null;
    try { window.sessionStorage.removeItem(SITZUNG); } catch (e) {}
    if (grund && typeof beiAbmeldung === "function") beiAbmeldung(grund);
  }
  /* Token läuft nach einer Stunde ab – still verlängern statt mitten in der Lektion Rechte verlieren. */
  async function erneuern() {
    if (!refreshToken || !CONFIG.apiKey) return false;
    try {
      const a = await fetch("https://securetoken.googleapis.com/v1/token?key=" + encodeURIComponent(CONFIG.apiKey), {
        method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(refreshToken) });
      if (!a.ok) { if (a.status === 400) abmeldenIntern("Anmeldung abgelaufen – bitte neu anmelden"); return false; }
      const d = await a.json();
      setzeSitzung({ idToken: d.id_token, refreshToken: d.refresh_token, localId: d.user_id, expiresIn: d.expires_in });
      return true;
    } catch (e) { return false; }
  }

  function takt() {
    if (!aktiverTakt) return;
    const holen = async () => {
      if (!aktiverTakt) return;
      await nachliefern();
      const r = await anfrage(aktiverTakt.pfad, "GET");
      if (aktiverTakt && aktiverTakt.status) aktiverTakt.status(r.ok ? "live" : (r.status === 0 ? "offline" : "fehler"));
      if (r.ok && aktiverTakt) aktiverTakt.rueckruf(r.daten);
    };
    holen();
    taktId = setInterval(holen, CONFIG.taktMs);
  }
  function pausieren() { if (taktId) { clearInterval(taktId); taktId = null; } }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) pausieren(); else if (aktiverTakt && !taktId) takt();
  });
  window.addEventListener("online", () => { nachliefern(); });

  return {
    url,
    get fehler() { return letzterFehler; },
    get angemeldet() { return idToken !== null; },
    get uid() { return uid; },
    get email() { return email; },
    get wartend() { return liste().length; },
    liste,
    lies: (pfad) => anfrage(pfad, "GET"),
    schreib: (pfad, wert) => anfrage(pfad, "PUT", wert),
    schreibSicher: (pfad, wert) => sicher("PUT", pfad, wert),
    ergaenzeSicher: (pfad, wert) => sicher("PATCH", pfad, wert),
    nachliefern,
    get beiAbmeldung() { return beiAbmeldung; },
    set beiAbmeldung(f) { beiAbmeldung = f; },

    /* Stufe 2: Anmeldung der Lehrperson. Das Passwort wird nie gespeichert. */
    async anmelden(mail, passwort) {
      if (!CONFIG.apiKey) return { ok: false, grund: "Oben im Code fehlt der apiKey." };
      try {
        const a = await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + encodeURIComponent(CONFIG.apiKey), {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: mail, password: passwort, returnSecureToken: true }) });
        const d = await a.json().catch(() => ({}));
        if (!a.ok) {
          const m = (d.error && d.error.message) || "";
          const grund = /INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_EMAIL/.test(m) ? "E-Mail oder Passwort stimmt nicht."
            : /TOO_MANY/.test(m) ? "Zu viele Versuche. Bitte kurz warten."
            : /OPERATION_NOT_ALLOWED|PASSWORD_LOGIN_DISABLED/.test(m) ? "In Firebase ist «E-Mail/Passwort» noch nicht eingeschaltet."
            : /API key|API_KEY/.test(m) ? "Der apiKey oben im Code stimmt nicht." : "Anmeldung fehlgeschlagen (" + (m || a.status) + ").";
          return { ok: false, grund };
        }
        email = d.email || mail;
        setzeSitzung(d);
        return { ok: true, uid: d.localId };
      } catch (e) { return { ok: false, grund: "Kein Netz – Anmeldung nicht möglich." }; }
    },
    async sitzungFortsetzen() {
      let s = null;
      try { s = JSON.parse(window.sessionStorage.getItem(SITZUNG) || "null"); } catch (e) {}
      if (!s || !s.refreshToken) return false;
      refreshToken = s.refreshToken; uid = s.uid; email = s.email;
      return erneuern();
    },
    abmelden() { abmeldenIntern(null); },

    /* Rückfall-Takt: rueckruf(daten) bei jeder Antwort; pausiert im Hintergrund. */
    starteTakt(pfad, rueckruf, status) { pausieren(); aktiverTakt = { pfad, rueckruf, status }; if (!document.hidden) takt(); },
    stoppeTakt() { pausieren(); aktiverTakt = null; },
  };
})();

/* Live-Verbindung: Firebase schickt Änderungen sofort (Server-Sent Events).
   Klappt das im Schulnetz nicht innert 12 s, wechselt die App auf den Takt. */
const Strom = (() => {
  let es = null, pfad = "", rueckruf = null, status = () => {}, nurTakt = false, wachhund = null, wiederTimer = null;
  function stopp() {
    if (es) { es.close(); es = null; }
    clearTimeout(wachhund); clearTimeout(wiederTimer); Sync.stoppeTakt();
  }
  function verbinden() {
    stopp();
    if (nurTakt || typeof EventSource === "undefined") {
      Sync.starteTakt(pfad, d => rueckruf({ art: "voll", daten: d }), status);
      return;
    }
    status("verbinde");
    let bekommen = false;
    es = new EventSource(Sync.url(pfad, false));
    wachhund = setTimeout(() => { if (!bekommen) { nurTakt = true; verbinden(); } }, 12000);
    const verarbeite = art => e => {
      bekommen = true; clearTimeout(wachhund); status("live");
      let m = null; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m && typeof m.path === "string") rueckruf({ art, pfad: m.path, daten: m.data });
    };
    es.addEventListener("put", verarbeite("put"));
    es.addEventListener("patch", verarbeite("patch"));
    es.addEventListener("cancel", () => { nurTakt = true; verbinden(); });
    es.onerror = () => {
      status(navigator.onLine === false ? "offline" : "verbinde");
      if (es && es.readyState === 2) wiederTimer = setTimeout(verbinden, 4000);
    };
  }
  document.addEventListener("visibilitychange", () => {
    if (!pfad || nurTakt) return;
    if (document.hidden) { if (es) { es.close(); es = null; } }
    else if (!es) verbinden();
  });
  return { start(p, cb, st) { pfad = p; rueckruf = cb; status = st || status; verbinden(); }, neu: () => verbinden() };
})();

const $ = (sel, wurzel = document) => wurzel.querySelector(sel);

function el(tag, attribute = {}, ...kinder) {
  const k = document.createElement(tag);
  for (const [n, w] of Object.entries(attribute || {})) {
    if (w === null || w === undefined || w === false) continue;
    if (n === "class") k.className = w;
    else if (n.startsWith("on") && typeof w === "function") k.addEventListener(n.slice(2).toLowerCase(), w);
    else k.setAttribute(n, w === true ? "" : w);
  }
  for (const kind of kinder.flat(Infinity)) {
    if (kind == null || kind === false) continue;
    k.append(kind instanceof Node ? kind : document.createTextNode(String(kind)));
  }
  return k;
}

function dialogOeffnen(inhalt) {
  Zustand.dialog = true;
  const hg = el("div", { class: "dialog-hg nicht-drucken" });
  const schliessen = () => { hg.remove(); Zustand.dialog = false; document.removeEventListener("keydown", esc); planeZeichnen(); };
  const esc = e => { if (e.key === "Escape") schliessen(); };
  hg.addEventListener("click", e => { if (e.target === hg) schliessen(); });
  document.addEventListener("keydown", esc);

  document.body.append(hg);
  const erst = hg.querySelector("button.aktiv, button");

}

const TAGE = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
function datum(s) {

  return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null;
}
function langdatum(s) { const d = datum(s); return d ? `${TAGE[d.getDay()]} ${s}` : (s || "ohne Datum"); }
function kurzdatum(s) { const d = datum(s); return d ? `${TAGE[d.getDay()]} ${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.` : (s || ""); }
function heuteIso() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

const plan = () => Daten.plan || null;
function sortiert(obj) {
  return Object.entries(obj || {}).filter(([, v]) => v && typeof v === "object")
    .map(([id, v]) => Object.assign({ id }, v))
    .sort((a, b) => ((a.ord ?? 9999) - (b.ord ?? 9999)) || a.id.localeCompare(b.id, "de", { numeric: true }));
}
const dls = () => sortiert(plan() && plan().dls);
const dlVon = id => (plan() && plan().dls && plan().dls[id]) || null;
const lernendeListe = () => sortiert(plan() && plan().lernende);
const auftraegeVon = dl => sortiert(dlVon(dl) && dlVon(dl).auftraege);
const hausaufgabenVon = dl => sortiert(dlVon(dl) && dlVon(dl).hausaufgaben);
const flkVon = dl => Object.entries((dlVon(dl) && dlVon(dl).flk) || {})
  .sort(([a], [b]) => a.localeCompare(b, "de", { numeric: true })).map(([id, text]) => ({ id, text }));
const tief = (o, ...k) => k.reduce((x, s) => (x && typeof x === "object") ? x[s] : undefined, o);
const statusVon = (dl, aid, sid) => tief(Daten, "stand", dl, aid, sid) || "";
const zielVon = (dl, sid) => tief(Daten, "ziel", dl, sid) || "";
const flkWert = (dl, lz, sid) => tief(Daten, "flk", dl, lz, sid) || "";
const istLehrer = () => DEMO ? Zustand.demoLehrer : Sync.angemeldet;
const ichBin = () => { const s = Speicher.lies("ichBin", null); return s && plan() && plan().lernende && plan().lernende[s] ? s : null; };
function nameVon(sid) { return Namen[sid] || tief(plan(), "lernende", sid, "label") || sid; }
function farbeVon(sid) { return tief(plan(), "lernende", sid, "farbe") || "#ccd3dd"; }
const initiale = sid => (nameVon(sid) || "?").trim().charAt(0).toUpperCase();
const erledigt = s => s === "fertig" || s === "kontrolliert";

function fortschritt(dl, sid) {
  let zu = 0, erl = 0;
  for (const a of auftraegeVon(dl)) { const s = statusVon(dl, a.id, sid); if (s) { zu++; if (erledigt(s)) erl++; } }
  return { zu, erl, anteil: zu ? erl / zu : 0 };
}
function xp(sid) {
  let summe = 0;
  for (const d of dls()) for (const a of auftraegeVon(d.id)) {

  }

}
function aktuelleDl() {
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  let wahl = null;
  for (const d of dls()) { const t = datum(d.datum); if (t && t <= heute) wahl = d.id; }
  return wahl || (dls()[0] && dls()[0].id) || null;
}

/* Lokalen Spiegel nachführen (Pfad relativ zu /oeffentlich). null löscht. */
function setzePfad(pfad, wert) {
  const teile = String(pfad).split("/").filter(Boolean);
  if (!teile.length) { Daten = (wert && typeof wert === "object") ? wert : {}; return; }
  let knoten = Daten; const kette = [];
  for (let i = 0; i < teile.length - 1; i++) {
    const t = teile[i];
    if (!knoten[t] || typeof knoten[t] !== "object") { if (wert === null || wert === undefined) return; knoten[t] = {}; }
    kette.push([knoten, t]); knoten = knoten[t];
  }
  const letzter = teile[teile.length - 1];
  if (wert === null || wert === undefined) {
    delete knoten[letzter];
    for (let i = kette.length - 1; i >= 0; i--) { const [e, t] = kette[i]; if (Object.keys(e[t]).length === 0) delete e[t]; else break; }
  } else knoten[letzter] = (typeof wert === "object") ? JSON.parse(JSON.stringify(wert)) : wert;
}

/* Noch nicht gesendete Eingaben über den Serverstand legen (sonst springen sie kurz zurück). */
function warteschlangeAnwenden() {
  if (DEMO) return;
  for (const e of Sync.liste()) {
    const rel = String(e.pfad).replace(/^oeffentlich\/?/, "");
    if (e.methode === "PATCH") for (const [k, w] of Object.entries(e.wert || {})) setzePfad(rel ? rel + "/" + k : k, w);
    else setzePfad(rel, e.wert);
  }
}

function ereignis(e) {
  if (e.art === "voll") { Daten = (e.daten && typeof e.daten === "object") ? e.daten : {}; warteschlangeAnwenden(); }
  else if (e.art === "put") { setzePfad(e.pfad, e.daten); if (e.pfad === "/") warteschlangeAnwenden(); }
  else if (e.art === "patch") { for (const [k, w] of Object.entries(e.daten || {})) setzePfad(e.pfad.replace(/\/$/, "") + "/" + k, w); }
  Zustand.geladen = true;
  planeZeichnen();
}

async function schreibe(pfad, wert) { return schreibeMehrere({ [pfad]: wert }); }
async function schreibeMehrere(aenderungen) {

  planeZeichnen();
  if (DEMO) { demoSichern(); return true; }
  const e = Object.entries(aenderungen);
  const r = e.length === 1 ? await Sync.schreibSicher("oeffentlich/" + e[0][0], e[0][1] === undefined ? null : e[0][1])
                           : await Sync.ergaenzeSicher("oeffentlich", aenderungen);
  if (r.ok) return true;
  if (r.gepuffert) { toast("Offline – deine Eingabe wird nachgeliefert."); planeZeichnen(); return true; }
  toast(r.status === 401 || r.status === 403 ? "Nicht gespeichert: dafür fehlt die Berechtigung." : "Nicht gespeichert (Fehler " + r.status + ").");
  const neu = await Sync.lies("oeffentlich");          // Stand vom Server zurückholen
  if (neu.ok) ereignis({ art: "voll", daten: neu.daten });
  return false;
}

function ausVorlage() {

  DATEN.lernende.forEach(([farbe, label], i) => { lernende["s" + (i + 1)] = { ord: i + 1, farbe, label }; });
  const p = { lernende, dls: {}, einstellungen: { uebersichtKlasse: false } };
  const stand = {};

    const dl = { ord: i + 1, datum: d.datum || "", thema: d.thema || "", ziel: d.ziel || "", auftraege: {}, hausaufgaben: {} };
    if (d.flk && d.flk.length) { dl.flk = {}; d.flk.forEach((t, j) => { dl.flk["lz" + (j + 1)] = t; }); }
    d.auftraege.forEach(([art, text, wo], j) => {

      dl.auftraege[aid] = { ord: j + 1, art, text, wo: wo || "" };
      if (art === "P") { stand[d.dl] = stand[d.dl] || {}; stand[d.dl][aid] = {}; Object.keys(lernende).forEach(s => { stand[d.dl][aid][s] = "offen"; }); }
    });
    d.hausaufgaben.forEach(([text, bis, alle], j) => {

/* Echte Namen kommen nur über den Link-Teil nach # aufs Gerät (wird nie an einen Server gesendet). */
function namenAusLink() {
  const m = /(?:^#|&)namen=([^&]*)/.exec(location.hash || "");

  let roh = m[1]; try { roh = decodeURIComponent(roh); } catch (e) {}

      aktion: () => schreibe(`ziel/${dlId}/${sid}`, w || null) })));
}
function flkWaehlen(dlId, lz, sid) {

      aktion: () => schreibe(`flk/${dlId}/${lz.id}/${sid}`, w || null) })));
}

function fertigKontrollieren(dlId, nurSid, nurAid) {
  const upd = {};
  for (const a of auftraegeVon(dlId)) {
    if (nurAid && a.id !== nurAid) continue;
    for (const l of lernendeListe()) {
      if (nurSid && l.id !== nurSid) continue;
      if (statusVon(dlId, a.id, l.id) === "fertig") upd[`stand/${dlId}/${a.id}/${l.id}`] = "kontrolliert";
    }
  }
  const n = Object.keys(upd).length;
  if (!n) { toast("Nichts auf «fertig» – nichts zu kontrollieren."); return; }
  schreibeMehrere(upd); toast(`${n} × auf «kontrolliert» gesetzt`);
}
function zuteilen(dlId, aid, an) {
  const upd = {};
  for (const l of lernendeListe()) {
    const s = statusVon(dlId, aid, l.id);
    if (an && !s) upd[`stand/${dlId}/${aid}/${l.id}`] = "offen";
    if (!an && s === "offen") upd[`stand/${dlId}/${aid}/${l.id}`] = null;
  }
  if (Object.keys(upd).length) schreibeMehrere(upd);
  toast(an ? "Allen zugeteilt" : "Zuteilung entfernt (wo noch «offen»)");
}

function spalteMenue(dlId, l) {

    { text: "✓ Alle «fertig» kontrollieren", klasse: "st-kontrolliert", aktion: () => fertigKontrollieren(dlId, l.id) },
  ]);
}
function zeileMenue(dlId, a) {

    { text: "Zuteilung entfernen (wo noch «offen»)", aktion: () => zuteilen(dlId, a.id, false) },
    { text: "✓ Alle «fertig» kontrollieren", klasse: "st-kontrolliert", aktion: () => fertigKontrollieren(dlId, null, a.id) },
    { text: "✏️ Auftrag bearbeiten", aktion: () => { Zustand.dl = dlId; wechsleAnsicht("lehrer"); } },
  ]);
}

function auftragHinzufuegen(dlId, text, wo, art, alle) {

  Zustand.ansicht = ["plan", "klasse", "uebersicht", "lehrer"].includes(q.get("ansicht")) ? q.get("ansicht")
    : (gespeichert && gespeichert !== "lehrer" ? gespeichert : (Speicher.lies("ichBin", null) ? "plan" : "klasse"));
  if (q.get("beamer") === "1") { Zustand.beamer = true; Zustand.ansicht = "klasse"; }
  if (DEMO) {
    const d = Speicher.lies("demoDaten", null);
    Daten = (d && d.plan) ? d : ausVorlage();
    demoSichern(); Zustand.geladen = true;
    zeichnen();
    return;
  }
  Sync.beiAbmeldung = grund => { toast(grund); zeichnen(); };
  zeichnen();
  Strom.start("oeffentlich", ereignis, st => { if (Zustand.verbindung !== st) { Zustand.verbindung = st; planeZeichnen(); } });
  if (await Sync.sitzungFortsetzen()) { await pruefeSchreibrecht(); planeZeichnen(); }
  setInterval(() => { if (Sync.wartend && !document.hidden) Sync.nachliefern().then(() => planeZeichnen()); }, 8000);
})();
</script>
