<title>Skilager Gruppen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: Pistenbrett – fixe Kopfleiste, darunter Tage und Rasterkarten pro Gruppe (Farbband = Gruppenfarbe, Pistenpunkt und Balken = Niveau), Bourbaki schraffiert. Leitung und Schüler/innen: eine Spalte fürs Handy. */
:root{
  --bg:#edf1f5; --surface:#ffffff; --soft:#e4eaf0; --ink:#13212e; --muted:#5a6a7a; --line:#d0d9e2;
  --accent:#c8241f; --accent-ink:#ffffff; --info:#1d5fd1;
  --ok:#1d7f46; --warn:#a96300; --bad:#c8241f;
  --p-blau:#1d5fd1; --p-rot:#d42a24; --p-schwarz:#15191d;
  --hatch:rgba(200,36,31,.07); --shadow:0 1px 2px rgba(19,33,46,.06),0 2px 8px rgba(19,33,46,.05);
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --surface:#16202a; --soft:#1f2b37; --ink:#e5ecf2; --muted:#93a3b3; --line:#2b3947;
  --accent:#ff5d55; --accent-ink:#1a0605; --info:#6b9dff; --ok:#4cc884; --warn:#f0a73a; --bad:#ff5d55;
  --p-blau:#4f8bff; --p-rot:#ff5d55; --p-schwarz:#05070a;
  --hatch:rgba(255,93,85,.08); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151c; --surface:#16202a; --soft:#1f2b37; --ink:#e5ecf2; --muted:#93a3b3; --line:#2b3947;
  --accent:#ff5d55; --accent-ink:#1a0605; --info:#6b9dff; --ok:#4cc884; --warn:#f0a73a; --bad:#ff5d55;
  --p-blau:#4f8bff; --p-rot:#ff5d55; --p-schwarz:#05070a;
  --hatch:rgba(255,93,85,.08); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:23px;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:3px;margin-left:auto;background:var(--soft);padding:3px;border-radius:8px;overflow-x:auto;max-width:100%}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.tab[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pill{font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.warn{color:var(--warn);border-color:var(--warn)}
main{padding-block:18px 60px}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.eyebrow{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.fld{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0}
.seg{display:inline-flex;gap:3px;background:var(--soft);padding:3px;border-radius:8px;margin-bottom:14px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:6px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--muted)}
.seg button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Tagesleiste */
.daybar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.day{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.day[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day .frei{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 180px;min-width:0;max-width:280px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;font-family:var(--f-display);font-size:17px}
.stats b{font-size:22px;font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums}
.note{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.note.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.note.info{border-color:var(--info);background:color-mix(in srgb,var(--info) 8%,var(--surface))}
.note ul{margin:4px 0 0;padding-left:18px}
.banner{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:4;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;margin-bottom:14px}
.banner .btn{background:transparent;color:inherit;border-color:currentColor}

/* Karten */
.sect{margin-top:22px}
.sect-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;align-items:start}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .15s}
.gcard.dragover,.gcard.target{box-shadow:0 0 0 3px var(--accent)}
.gband{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;background:var(--soft);color:var(--ink)}
.gname{flex:1;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcount{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.25);padding:0 8px;border-radius:20px}
.gcount.over{background:var(--bad);color:#fff}
.zbtn{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:20px;padding:0 9px;font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;opacity:.85}
.zbtn[aria-pressed="true"]{opacity:1;border-width:2.5px;font-weight:700}
.gmeta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:6px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);min-width:0}
.piste{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.5px var(--line);flex:none}
.pips{display:inline-flex;gap:2px;align-items:flex-end;flex:none}
.pips i{display:block;width:5px;border-radius:1px;background:var(--line)}
.pips i.on{background:var(--pc)}
.chips{display:flex;flex-direction:column;gap:4px;padding:8px;min-height:44px}
.chip{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:1px solid transparent;background:var(--soft);border-radius:6px;padding:5px 8px;cursor:grab;font-size:14.5px}
.chip:hover{border-color:var(--line)}
.chip .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .lv{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip .mk{font-weight:700;font-size:13px;min-width:12px;text-align:center}
.mk.up{color:var(--ok)} .mk.down{color:var(--warn)} .mk.side{color:var(--muted)} .mk.back{color:var(--accent)} .mk.rm{color:var(--info)}
.chip.hit{outline:2.5px solid var(--accent);outline-offset:1px}
.chip.dim{opacity:.35}
.chip .why{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .stack{flex:1;min-width:0;display:flex;flex-direction:column}
.empty{margin:4px;color:var(--muted);font-size:13px;font-style:italic}
.gcard.sick{border-color:var(--bad);background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--hatch) 10px 20px)}
.gcard.sick .gband{background:var(--surface);color:var(--bad);border-bottom:2px solid var(--bad)}
.gcard.pool{border-style:dashed}
.cross{display:inline-grid;place-items:center;width:20px;height:20px;background:var(--bad);color:#fff;border-radius:3px;font-weight:700;font-size:16px;line-height:1;flex:none}
.pgrp + .pgrp{border-top:1px solid var(--line)}
.pgh{display:flex;align-items:center;gap:8px;padding:8px 10px 0;font-family:var(--f-display);font-weight:600;font-size:15px}
.pgh .btn{margin-left:auto}
.fb{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.fb li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:7px}
.fb li.done{opacity:.55}
.fb .t{color:var(--muted);font-size:13px;flex-basis:100%}

/* Einrichten */
.cards{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card > h2{margin-bottom:4px}
.card > p.lead{margin:0 0 12px;color:var(--muted);max-width:75ch}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%}
th{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td input[type=text],td input[type=number],td select{width:100%;min-width:70px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 7px}
td input[type=color]{width:38px;height:30px;border:1px solid var(--line);border-radius:6px;padding:1px;background:var(--surface)}
label.inl{display:flex;align-items:center;gap:6px}
.qty{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:12px;background:var(--soft);border-radius:8px}
.qty label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.qty input{width:80px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface)}
textarea.fld{min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;width:100%}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.fams{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.fam{border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.famh{display:flex;gap:6px;align-items:center}
.famh .fld{flex:1;font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase}
.sub{background:var(--soft);border-radius:7px;padding:8px;display:grid;gap:6px}
.subl{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:17px}
.subl .row{margin-left:auto;gap:4px}
.sub label{display:grid;grid-template-columns:80px 1fr;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sub label .fld{width:100%}
.rulelist{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.rulelist li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 10px;background:var(--soft);border-radius:7px}
.tag{font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em;padding:1px 8px;border-radius:20px;border:1px solid currentColor}
.tag.apart{color:var(--bad)} .tag.together{color:var(--ok)}
.linkrow{display:grid;grid-template-columns:140px 1fr auto;gap:8px;align-items:center;margin-top:6px}
.linkrow code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--soft);padding:5px 8px;border-radius:6px;font-size:12.5px;min-width:0}
pre.rules{background:var(--soft);padding:10px;border-radius:7px;overflow:auto;max-height:260px;font-size:12px}
@media (max-width:560px){.linkrow{grid-template-columns:1fr}}

/* Einstieg, Login */
.start{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:760px}
.steps{list-style:none;padding:0;margin:16px 0;display:grid;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.stackf{display:grid;gap:10px;margin-top:12px;max-width:360px}
.stackf label{display:grid;gap:3px;font-size:13px;color:var(--muted)}

/* Verlauf */
.hist{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.hist table td,.hist table th{white-space:nowrap}
.hist th:first-child,.hist td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.hcell{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:3px;flex:none}

/* Leitung und Schüler/innen */
.preview{border:2px dashed var(--line);border-radius:14px;padding:14px;max-width:560px}
.one{max-width:620px}
.lband,.meband{border-radius:12px;padding:14px 16px;margin-bottom:12px}
.big{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.kann{margin:0 0 6px;font-size:14px}
.kann b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-size:13px}
.lrow{display:grid;grid-template-columns:44px 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.lname{min-width:0;display:flex;flex-direction:column}
.lname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;font-weight:700;color:transparent}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.rmb{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:17px;color:var(--muted)}
.rmb.on{background:var(--info);border-color:var(--info);color:#fff}
.lnote{grid-column:2 / -1;width:100%;font-size:14px}
.mini{list-style:none;margin:0;padding:8px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.kv{display:grid;grid-template-columns:100px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv > span:first-child{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--muted)}
.kv.top{align-items:start}
.sel{user-select:all;font-variant-numeric:tabular-nums}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:12px}
.nbtn{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:10px;text-align:left;cursor:pointer;font-weight:500}
.sv{display:grid;gap:12px}
.sv .card{padding:12px 16px}
.hello{font-size:28px}
.sickcard{border-color:var(--bad);background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--hatch) 10px 20px)}

/* Dialog */
.backdrop{position:fixed;inset:0;background:rgba(10,18,26,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 40px) 16px 16px;overflow:auto}
.dlg{background:var(--surface);border-radius:12px;max-width:560px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h3{font-size:22px}
.dlg .sub2{color:var(--muted);font-size:14px;margin:2px 0 12px}
.dest{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:6px 0 14px}
.dest button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;cursor:pointer;text-align:left;min-width:0}
.dest button span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.dest button .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dest button[aria-current="true"]{border-color:var(--ink);background:var(--soft)}
.dest button.risk{border-color:var(--warn)}
.back-btn{width:100%;justify-content:center;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (max-width:700px){.tabs{margin-left:0;width:100%}.tab{flex:1;padding:6px 8px;font-size:16px}.brand{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="fams">${S.fam.map((f, fi) => `<div class="fam"><div class="famh"><span class="piste" style="--pc:${PISTE[Math.min(2, fi)]}"></span><input class="fld" data-f="fam-name" data-id="${f.id}" value="${esc(f.name)}" aria-label="Name der Stufe"><button class="btn small" data-act="famup" data-i="${fi}"${fi ? "" : " disabled"} aria-label="Stufe nach links">←</button><button class="btn small danger" data-act="famdel" data-id="${f.id}" aria-label="Stufe löschen">✕</button></div>

      <label>Ski<input class="fld" data-f="sub-ski" data-id="${s.id}" value="${esc(s.ski)}" placeholder="Kann …"></label><label>Snowboard<input class="fld" data-f="sub-board" data-id="${s.id}" value="${esc(s.board)}" placeholder="Kann …"></label></div>`).join("")}
    <button class="btn small ghost" data-act="subadd" data-fid="${f.id}" data-pos="bottom">+ unten einfügen (schwächer)</button></div>`).join("")}</div>
  <div class="row" style="margin-top:10px"><button class="btn small" data-act="famadd">+ Stufe</button></div></section>`;

function siteBase() { const b = CONFIG.seite || S.lager.url || (location.origin + location.pathname); return b.split("#")[0].split("?")[0]; }
function nameHash() { return encNames(S.students.map(s => [s.id, s.name])); }

  const links = [["Schüler/innen", ""], ["Leitung", "?ansicht=leiter"], ["Lagerleitung", "?ansicht=lp"]];
  const hashNow = nameHash(), stale = S.linkSig && S.linkSig !== hashNow;
  const linkBox = S.students.length ? `<h3 style="margin-top:14px">Links</h3><p class="muted" style="margin:2px 0 4px">Die Namen stecken im Link (Teil nach #) und landen nie in der Datenbank. Kommt eine Person dazu oder ändert ein Name, die Links neu verschicken.</p>

    ${links.map(([l, q], i) => `<div class="linkrow"><b>${l}</b><code>${esc(siteBase() + q)}#n=…</code><button class="btn small" data-act="copylink" data-i="${i}">Kopieren</button></div>`).join("")}
    ${!CONFIG.seite ? `<label class="inl" style="margin-top:8px">Adresse der Seite <input class="fld" style="flex:1" data-f="url" value="${esc(S.lager.url)}" placeholder="https://…github.io/…/skilager/"></label>` : ""}` : "";
  if (!ONLINE) return `<section class="card"><h2>Online</h2><p class="lead">Noch lokal: Alles bleibt auf diesem Gerät. Für Leiter- und Schüleransicht in <code>index.html</code> oben bei CONFIG die Datenbank-Adresse und den apiKey eintragen (Schritte im LIESMICH). Unter «Vorschau» siehst du schon jetzt, wie es bei Leitung und Schüler/innen aussieht.</p>${linkBox}</section>`;
  if (!Sync.angemeldet) return `<section class="card"><h2>Online</h2>${loginForm("lp")}</section>`;
  const lu = S.leiterUids.split(/[\s,;]+/).filter(Boolean);
  return `<section class="card"><h2>Online</h2><p class="lead">Angemeldet. Änderungen gehen nach gut einer Sekunde an Leitung und Schüler/innen.</p>
    <div class="row"><span class="muted">Dein Konto:</span><code class="sel">${esc(S.uidLP)}</code><button class="btn small" data-act="logout">Abmelden</button></div>
    <h3 style="margin-top:14px">Leitungskonten</h3><p class="muted" style="margin:2px 0 6px">UID aus Firebase → Authentication → Users. Mehrere durch Komma trennen. Danach die Regeln neu einspielen.</p>
    <input class="fld" style="width:100%" data-f="leiterUids" value="${esc(S.leiterUids)}" placeholder="UID Leitungskonto">
    ${linkBox}
    <h3 style="margin-top:14px">Regeln</h3><p class="muted" style="margin:2px 0 6px">Firebase-Konsole → Realtime Database → Rules: ersetzen und veröffentlichen.${lu.length ? "" : " Noch kein Leitungskonto eingetragen."}</p>
    <pre class="rules" id="rulestext">${esc(JSON.stringify(rulesJSON(S.uidLP || MYUID, lu), null, 2))}</pre><button class="btn small" data-act="copyrules">Regeln kopieren</button>
    <h3 style="margin-top:14px">Nach dem Lager</h3><p class="muted" style="margin:2px 0 6px">Die Datenbank ist kein Archiv: Excel exportieren, Backup speichern, dann online löschen.</p><button class="btn small danger" data-act="wipe">Online-Daten löschen</button></section>`;
}
function rulesJSON(lp, leiter) {
  const L = leiter.length ? leiter : ["LEITER_UID"];
  const isLP = `auth != null && auth.uid === '${lp || "LEHRER_UID"}'`;
  const isAny = `auth != null && (auth.uid === '${lp || "LEHRER_UID"}'${L.map(u => ` || auth.uid === '${u}'`).join("")})`;
  return { rules: { ".read": false, ".write": false, [CONFIG.projekt]: {
    oeffentlich: { ".read": true, ".write": isLP },
    leitstand: { ".read": isAny, ".write": isLP,
      appell: { "$tag": { "$gruppe": { "$slot": { "$sid": { ".write": isAny, ".validate": "newData.isBoolean() && $sid.length <= 20" } } } } },
      rueckmeldung: { "$tag": { "$sid": { ".write": isAny,
        ".validate": "newData.hasChildren(['r', 'g', 'z']) && $sid.length <= 20",
        r: { ".validate": "newData.val() === 'auf' || newData.val() === 'ab' || newData.val() === 'ok'" },
        g: { ".validate": "newData.isString() && newData.val().length <= 20" },
        z: { ".validate": "newData.isNumber()" },
        t: { ".validate": "newData.isString() && newData.val().length <= 200" },
        "$anderes": { ".validate": false } } } } } } } };
}
function loginForm(role) {
  return `<form id="loginform" data-role="${role}"><p class="eyebrow">${role === "lp" ? "Lagerleitung" : "Leitung"}</p><h2>Anmelden</h2><div class="stackf">
    <label>E-Mail<input class="fld" id="lmail" type="email" autocomplete="username" required></label>

    <button class="btn primary" type="submit">Anmelden</button><p class="muted" id="lmsg" style="margin:0"></p></div></form>`;
}

/* ---------- Leitung ---------- */
function leaderInner() {
  if (!D || !D.days || !D.days.length) return '<p class="muted">Noch keine Daten von der Lagerleitung.</p>';
  const di = Math.min(LV.day ?? D.days.length - 1, D.days.length - 1), d = D.days[di];
  const g = grp(LV.gid);
  let h = dayBar("lday", di, false);
  h += `<div class="toolbar"><label class="inl"><span class="eyebrow">Meine Gruppe</span><select class="fld" data-f="l-gid">${opt("", "– wählen –", !g)}${allGroups().map(x => opt(x.id, x.name + (x.leader ? " · " + x.leader : ""), g && x.id === g.id)).join("")}</select></label></div>`;
  h += `<div class="seg">${[["gruppe","Meine Gruppe"],["alle","Alle Gruppen"],["zimmer","Zimmer & Ämtli"]].map(([k, l]) => `<button data-act="ltab" data-v="${k}" aria-current="${LV.tab === k}">${l}</button>`).join("")}</div>`;
  if (LV.tab === "alle") return h + leaderAll(d);
  if (LV.tab === "zimmer") return h + leaderRooms(d);
  return h + (g ? leaderGroup(d, g) : '<p class="muted">Wähle oben deine Gruppe. Das Gerät merkt sich die Wahl.</p>');
}
function leaderGroup(d, g) {
  const mem = D.students.filter(s => d.assign[s.id] === g.id).sort(byName);
  const slot = Math.min(LV.slot, D.slots.length - 1);
  const ap = ((getR().appell[d.id] || {})[g.id] || {})[slot] || {};
  const here = mem.filter(s => ap[s.id]).length;
  const rm = getR().rm[d.id] || {};
  const up = adjacent(g.id, "auf"), down = adjacent(g.id, "ab");
  let h = `<section class="lband" style="background:${esc(g.color)};color:${textOn(g.color)}"><div class="eyebrow" style="color:inherit;opacity:.85">${TYPES[g.type]} · ${esc(lvLabel(g.level) || "ohne Niveau")}</div><div class="big">${esc(g.name)}</div>${g.meet ? `<div>Treffpunkt: ${esc(g.meet)}</div>` : ""}</section>`;
  if (g.level) h += `<div class="card" style="margin-bottom:12px"><p class="kann"><b>Kann</b> ${esc(lvDesc(g.level, g.type) || "–")}</p>${up ? `<p class="kann muted"><b>Aufstufen nach ${esc(up.name)} (${esc(lvLabel(up.level))})</b> ${esc(lvDesc(up.level, g.type))}</p>` : ""}${down ? `<p class="kann muted"><b>Abstufen nach ${esc(down.name)} (${esc(lvLabel(down.level))})</b> ${esc(lvDesc(down.level, g.type))}</p>` : ""}</div>`;
  h += `<div class="sect-h"><h2>Appell</h2><span class="eyebrow num">${here} von ${mem.length} da</span></div>
    <div class="row" style="margin-bottom:6px"><div class="seg" style="margin:0">${D.slots.map((s, i) => `<button data-act="lslot" data-i="${i}" aria-current="${i === slot}">${esc(s)}</button>`).join("")}</div><button class="btn small" data-act="apall" data-gid="${g.id}">alle da</button><button class="btn small ghost" data-act="apnone" data-gid="${g.id}">zurücksetzen</button></div>`;
  h += mem.map(s => { const r = rm[s.id]; return `<div class="lrow"><button class="ck${ap[s.id] ? " on" : ""}" data-act="ap" data-gid="${g.id}" data-sid="${s.id}" aria-pressed="${!!ap[s.id]}" aria-label="${esc(nameOf(s.id))} anwesend">✓</button>
      <div class="lname"><b>${esc(nameOf(s.id))}</b><span class="muted" style="font-size:13px">${s.self ? "selbst: " + esc(lvLabel(s.self)) : ""}${r ? ` · <span style="color:var(--info)">${r.r === "auf" ? "aufstufen gemeldet" : r.r === "ab" ? "abstufen gemeldet" : "Bemerkung"}</span>` : ""}</span></div>
      <button class="rmb${r && r.r === "auf" ? " on" : ""}" data-act="rm" data-gid="${g.id}" data-sid="${s.id}" data-r="auf" title="aufstufen vorschlagen"${up ? "" : " disabled"}>↑</button><button class="rmb${r && r.r === "ab" ? " on" : ""}" data-act="rm" data-gid="${g.id}" data-sid="${s.id}" data-r="ab" title="abstufen vorschlagen"${down ? "" : " disabled"}>↓</button>
      ${r ? `<input class="fld lnote" data-f="l-note" data-gid="${g.id}" data-sid="${s.id}" maxlength="200" placeholder="Bemerkung für die Lagerleitung" value="${esc(r.t || "")}">` : ""}</div>`; }).join("") || '<p class="empty">Niemand in dieser Gruppe.</p>';
  const miss = mem.filter(s => !ap[s.id]);
  if (here && miss.length) h += `<div class="note warn" style="margin-top:12px"><b>Fehlt:</b> ${miss.map(s => esc(nameOf(s.id))).join(", ")}</div>`;
  h += `<p class="muted" style="font-size:13px">↑ ↓ schlägt der Lagerleitung vor, die Person morgen eine Gruppe höher oder tiefer einzuteilen. Ein zweites Antippen nimmt den Vorschlag zurück.</p>`;
  return h;
}
function leaderAll(d) {
  const sick = D.students.filter(s => d.assign[s.id] === "B").sort(byName);
  let h = `<div class="grid">${allGroups().map(g => { const mem = D.students.filter(s => d.assign[s.id] === g.id).sort(byName);
    return `<section class="gcard"><header class="gband" style="background:${esc(g.color)};color:${textOn(g.color)}"><span class="gname">${esc(g.name)}</span><span class="gcount">${mem.length}</span></header><div class="gmeta">${lvTag(g.level, TYPES[g.type])}${g.leader ? `<span>· ${esc(g.leader)}</span>` : ""}${g.contact ? `<span class="sel">· ${esc(g.contact)}</span>` : ""}</div><ul class="mini">${mem.map(s => `<li>${esc(nameOf(s.id))}</li>`).join("") || '<li class="muted">–</li>'}</ul></section>`; }).join("")}
    <section class="gcard sick"><header class="gband"><span class="gname">Krank · Bourbaki</span><span class="gcount">${sick.length}</span></header><ul class="mini">${sick.map(s => { const k = d.sick[s.id] || {}; return `<li><b>${esc(nameOf(s.id))}</b> <span class="muted">${esc([k.reason, k.since != null ? "seit " + dayLabel(k.since) : ""].filter(Boolean).join(" · "))}</span></li>`; }).join("") || '<li class="muted">alle gesund</li>'}</ul></section></div>`;
  return h;

    st.push({ id: uid(), name: `${first} ${N[Math.floor(rnd() * N.length)]}`, klasse: ["1A","1B","1C"][i % 3], sex: m ? "m" : "w", disc, self: disc === "poly" ? null : L[r].id, note: "" }); }
  S.students = st; S.days = [newDay()]; S.cur = 0; S.local = { appell: {}, rm: {} };
  S.rules = [{ type: "apart", ids: [st[0].id, st[4].id], scope: "beide" }, { type: "together", ids: [st[1].id, st[3].id], scope: "zimmer" }];
  S.rooms = Array.from({ length: 10 }, (_, i) => ({ id: uid(), name: `Zimmer ${i + 1}`, cap: 7, leader: "" }));
  S.roomAssign = {}; const boys = st.filter(s => s.sex === "m"), girls = st.filter(s => s.sex === "w");
  boys.forEach((s, i) => S.roomAssign[s.id] = S.rooms[Math.floor(i / 7)].id); girls.forEach((s, i) => S.roomAssign[s.id] = S.rooms[5 + Math.floor(i / 7)].id);
  // Beispiel-Einteilung: nächste passende Gruppe zur Selbsteinschätzung (im echten Lager teilt ihr von Hand ein)
  const d = S.days[0];
  for (const s of st) { const gs = S.groups.filter(g => g.type === s.disc); if (!gs.length) continue; const sr = lvRank(s.self);
    const best = gs.map(g => ({ g, c: (sr == null || lvRank(g.level) == null ? 0 : Math.abs(sr - lvRank(g.level))) * 100 + st.filter(x => d.assign[x.id] === g.id).length })).sort((a, b) => a.c - b.c)[0].g; d.assign[s.id] = best.id; }
  d.assign[st[7].id] = "B"; d.sick[st[7].id] = { reason: "Knie", since: 0, from: null };
  S.rooms.slice(0, 4).forEach((r, i) => st.filter(s => S.roomAssign[s.id] === r.id).forEach(s => d.aem[s.id] = S.aemtli[i].id));
  S.groups.forEach((g, i) => { g.leader = ["Lewin S.","Andrea K.","Marco B.","Sabine R.","Thomas W.","Nadia F.","Reto M.","Jasmin L.","Patrick Z.","Corinne H."][i] || ""; g.contact = "079 000 00 " + String(10 + i); g.meet = "9.00 Talstation"; });
  d.frei = true;
  const g0 = S.groups[2], mem = st.filter(s => d.assign[s.id] === g0.id);
  if (mem[0]) S.local.rm[d.id] = { [mem[0].id]: { r: "auf", g: g0.id, z: Date.now(), t: "fährt schon parallel" } };
  S.lager.name = "Beispiel – Skilager"; S.view = "board"; S.board = "gruppen"; render(); toast("Beispiellager mit 64 erfundenen Namen geladen.");
}

/* Online: Anmeldung und Abgleich */
async function afterLoginLP(uidLP) {
  MYUID = uidLP; S.uidLP = uidLP;
  const r = await Sync.lies("leitstand/stand"); netz(r);
  const st = r.ok ? r.daten : null;
  if (!st) { publish(); }
  else if (!S.students.length) adoptStand(st);
  else if ((st.ts || 0) > (S.ts || 0) + 2000) {
    ask("Neuerer Stand online", `Online liegt ein Stand von ${new Date(st.ts).toLocaleString("de-CH")}. Laden? Sonst überschreibt dieses Gerät den Online-Stand.`, "Online-Stand laden", () => adoptStand(st));
    setTimeout(() => { const c = document.querySelector('.dlg [data-act="close"]'); if (c) c.textContent = "Meinen Stand behalten"; }, 0);
  } else publish();
  Takt.start([
    { p: "leitstand/appell", ms: CONFIG.taktMs, cb: v => { if (v === undefined) return; if (sig("ap", v)) { REMOTE.appell = v || {}; redraw(); } } },
    { p: "leitstand/rueckmeldung", ms: CONFIG.taktMs * 2, cb: v => { if (v === undefined) return; if (sig("rm", v)) { REMOTE.rm = v || {}; redraw(); } } },
  ]);
  render();
}
function adoptStand(st) {
  st = norm(JSON.parse(JSON.stringify(st)));
  const old = Object.fromEntries(S.students.map(s => [s.id, s]));
  st.students = st.students.map(s => ({ id: s.id, name: old[s.id]?.name || LINKNAMES[s.id] || "Unbekannt", klasse: old[s.id]?.klasse || "", sex: old[s.id]?.sex || "", disc: s.disc, self: s.self || null, note: old[s.id]?.note || "" }));
  S = { ...S, lager: { ...S.lager, ...st.lager }, fam: st.fam, groups: st.groups, students: st.students, rules: st.rules, rooms: st.rooms, roomAssign: st.roomAssign, aemtli: st.aemtli, slots: st.slots, days: st.days, ts: st.ts };
  S = norm(S); lastSig = null; render(); toast("Online-Stand geladen.");
}
const SIGS = {};
function sig(k, v) { const s = JSON.stringify(v ?? null); if (SIGS[k] === s) return false; SIGS[k] = s; return true; }
function redraw() { const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; if ($("#layer").innerHTML) return; render(); }
function startLeaderPoll() {
  Takt.start([
    { p: "leitstand/stand", ms: CONFIG.taktMs * 3, cb: (v, st) => { if (st) { DENIED = true; render(); return; } DENIED = false; if (!v) { if (!STAND_LEER) { STAND_LEER = true; render(); } return; } STAND_LEER = false; if (sig("st", v)) { D = norm(v); cache(); redraw(); } } },
    { p: "leitstand/appell", ms: CONFIG.taktMs, cb: v => { if (v === undefined) return; if (sig("ap", v)) { REMOTE.appell = v || {}; cache(); redraw(); } } },
    { p: "leitstand/rueckmeldung", ms: CONFIG.taktMs, cb: v => { if (v === undefined) return; if (sig("rm", v)) { REMOTE.rm = v || {}; cache(); redraw(); } } },
  ]);
}
